  <h2><font face="Arial" color="#5A6D94">Converting an attribute to an association</font></h2> 
  <ol> 
   <li>On a diagram pane, select an attribute.</li> 
   <li>From the attribute shortcut menu, select <b>Refactor</b> &gt; <b>Convert To</b> &gt; <b>Association</b>.</li> 
  </ol>
