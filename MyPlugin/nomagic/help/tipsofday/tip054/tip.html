  <h2><font face="Arial" color="#5A6D94">Showing applied stereotypes in Model Browser</font></h2> 
  <p>Do one of the following:</p> 
  <ul> 
   <li>In the <b>Model Browser</b> toolbar, click the <img border="0" src="options.png"> <i>Options</i> button, and then click to check the <b>Show Applied Stereotypes</b>.</li> 
   <li>Right-click the free space in the Containment tree and click to check the <b>Show Applied Stereotypes</b>.</li> 
  </ul>
