  <h2><font color="#5a6d94" face="Arial">Wrapping text in a symbol</font></h2> 
  <ol> 
   <li>Select the symbol you want to include the wrapped text in.</li> 
   <li>Open the <b>Symbol Properties</b> dialog.</li> 
   <li>Click to select the <b>Wrap Words</b> check box and click <b>OK</b>.</li> 
  </ol>
