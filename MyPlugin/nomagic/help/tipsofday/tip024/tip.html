  <h2><font face="Arial" color="#5A6D94">Navigate from a symbol to its element</font></h2> 
  <p>Do one of the following:</p> 
  <ul> 
   <li>Right-click the symbol. From the shortcut menu, choose the <b>Select in Containment Tree</b> command.</li> 
   <li>Select the symbol and press <b>Alt+B</b>.</li> 
  </ul>
