  <h2><font face="Arial" color="#5A6D94">Switch between open projects</font></h2> 
  <p>Do one of the following:</p> 
  <ul> 
   <li>From the <b>File menu</b>, select <b>Switch Projects</b> and then click the name of the project you want to switch to.</li> 
   <li>On the main toolbar, click the <img border="0" src="switch_projects.png"> <i>Switch Projects</i> button, and then select the name of the project you want to switch to.</li>
