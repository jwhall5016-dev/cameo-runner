  <h2><font face="Arial" color="#5A6D94">Opening recently used projects</font></h2> 
  <p>Do one of the following:</p> 
  <ul> 
   <li>On the Welcome screen, under <b>Recent Projects</b>, click the project.</li> 
   <li>From the <b>Collaboration</b> menu, select <b>Recent Server Projects</b>. Select the server projects you want to open.</li> 
   <li>From the <b>File</b> menu, select the project.</li> 
  </ul>
