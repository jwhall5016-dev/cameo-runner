  <h2><font face="Arial" color="#5A6D94">Changing tooltip style</font></h2> 
  <ol> 
   <li>From the main menu, select <b>Options</b> &gt; <b>Project</b>.</li> 
   <li>In the <b>Project Options</b> dialog, find the <b>Tooltips Style</b> option.</li> 
   <li>Select one of the following value - <b>Do Not Show</b> (default), <b>Show Element Name</b>, or <b>Show Element Documentation</b>.</li> 
  </ol>
