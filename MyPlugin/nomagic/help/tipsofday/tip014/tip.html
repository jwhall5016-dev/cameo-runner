  <h2><font face="Arial" color="#5A6D94">To turn off highlighting of the modified elements in model browser</font></h2> 
  <ol> 
   <li>From the main menu, select <b>Options</b> &gt; <b>Environment</b>. The <b>Environment Options</b> dialog opens.</li> 
   <li>Click the <b>Browser</b> options group.</li> 
   <li>In the <b>Browser</b> options pane, set the <b>Show Changes</b> value to <i>false</i>.</li> 
  </ol>

   <img border="1" src="Tip_Changes in Browser(14).png"> 
  </ul>
