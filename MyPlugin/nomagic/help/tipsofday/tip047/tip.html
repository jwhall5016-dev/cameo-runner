 <body> 
  <h2><font face="Arial" color="#5A6D94">Find all elements of a particular type</font></h2> 
  <ol> 
   <li>In the main menu, click <b>Edit</b> &gt; <b>Find</b> or press Ctrl + Shift + F.</li> 
   <li>Click the <b>'...'</b> button near the <b>Type</b> box. The <b>Select Element Type</b> dialog opens.</li> 
   <li>Select the types of elements and click <b>OK</b>.</li> 
   <li>Click the <b>Find</b> button.</li> 
  </ol>
