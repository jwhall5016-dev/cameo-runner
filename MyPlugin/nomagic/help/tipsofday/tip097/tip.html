  <h2><font color="#5A6D94" face="Arial">Multiple element layout</font></h2> 
  <p>Select multiple elements and lay them out using the following layout actions from the diagram toolbar:</p> 
  <ul> 
   <li>Make Same <i>Width</i>, <i>Height</i> or <i>Size</i></li> 
   <li>Center <i>Horizontally</i> or <i>Vertically</i></li> 
   <li>Space Evenly <i>Horizontally</i> or <i>Vertically</i></li> 
   <li>Align <i>Right</i>, <i>Left</i>, <i>Top</i> or <i>Bottom</i></li> 
  </ul>
