  <h2><font face="Arial" color="#5A6D94">Changing the activity diagram orientation</font></h2> 
  <ol> 
   <li>From the diagram pane shortcut menu, select <b>Diagram Properties</b>, or press <b>Shift</b> + <b>Enter</b> to open the <b>Diagram Properties</b> dialog.</li> 
   <li>Change the value for the <b>Diagram Orientation</b> property in the <b>Diagram Properties</b> dialog.</li> 
  </ol>
