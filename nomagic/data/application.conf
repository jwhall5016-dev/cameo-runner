akka {

    stdout-loglevel = "WARNING"
    loglevel = "WARNING"

    loggers = ["akka.event.slf4j.Slf4jLogger"]

    actor {
        provider = "akka.actor.LocalActorRefProvider"

        serializers {
            kryo = "com.nomagic.esi.serializer.akka.AkkaSerializer"
        }

        serialization-bindings {
            "com.nomagic.esi.serializer.IMessage" = kryo
        }

    }
    jvm-exit-on-fatal-error = false
}

esi {
    actor.message.timeout = 10000000

    kryoserializer {
        buffersize = 8192
        max-buffersize = 134217728
        kryo-registrationrequired = false
        kryo-references = true
        pool-max-objects = 16
        pool-max-wait-time-ms = 5000
    }

    client {

        #The same as esi.system.name on the server-side.
        system.name="CedwServer"

        #number of elements in one commit message
        bulk-commit-size=50

        cache.fast-update = false

        login-timeout = 120000

        cache.use-cache-ref-deduplication = false
    }

	stream {
		thread-pool-size=100
		max-wait-duration-seconds = 3600

        	# Maximum waiting time in seconds that a stream will request missing message from its remote stream
        	# if it does not receive any message in this period of time.
        	# This config's value should be set less than 'max-wait-duration-seconds'
       	ask-resend-duration-seconds = 150
	}

    emf.commit-bidiref-checker.use-cached-lookup = true
    emf.fsa.detect-concurrent-writes = exception
    emf.locks = true

    net.client-accept-timeout = 120
}

esi.auth {
          protocol = "https"

          # If https is enabled in Authentication server, path to a certificate or a key store is needed

          # The key store format must be JKS or PKCS12.

          https {

                 # the file name of the certificate or the key store (should be a full path)

                 file = "configuration/teamworkcloud.crt"

                 # certificate_mode: "true" if the file is a certificate; "false" if the file is a key store.

                 is_certificate_file = true

                 # key store password

                 password = ""
          }

          disable-check-ssl-certificate = true
}
