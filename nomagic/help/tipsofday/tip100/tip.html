 <body> 
  <h2><font color="#5A6D94" face="Arial">Searching for usages and dependencies </font></h2> 
  <ol> 
   <li>Right-click the element.</li> 
   <li>In the shortcut menu of the element, click <b>Related Elements</b>. Select <b>Used By</b> or <b>Depends On</b>.</li> 
   <li>In the <b>Usages/Dependencies Search Options</b> dialog, select the search options you want to use.</li> 
   <li>Click <b>OK</b> to start the search.</li> 
  </ol>
