 <body> 
  <h2><font face="Arial" color="#5A6D94">Assigning shortcut keys</font></h2> 
  <ol> 
   <li>From the main menu, select <b>Options</b> &gt; <b>Environment</b>.</li> 
   <li>In the <b>Keyboard</b> option group, search for the command you need to assign a shortcut to.</li> 
   <li>Click the <b>Press new shortcut key</b> box. Press the shortcut you want to assign.</li> 
   <li>Click the <b>Assign</b> button.</li> 
  </ol>  
 </body>
