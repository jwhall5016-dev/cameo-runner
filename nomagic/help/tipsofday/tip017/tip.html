  <h2><font face="Arial" color="#5A6D94">Using the To Do property</font></h2> 
  <p>Use the <b>To Do</b> property to add notes about work to be done. You can specify <b>To Do</b> values in the element <b>Specification window</b>.<br><br> From the main toolbar, click <b>Edit</b> &gt; <b>Find TODO</b> to find all elements containing information in the <b>To Do</b> property.</p>
