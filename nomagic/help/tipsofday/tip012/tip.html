  <h2><font face="Arial" color="#5A6D94">Displaying related elements</font></h2> 
  <ol> 
   <li>Select a diagram frame or one or more shapes on the diagram pane.</li> 
   <li>Right-click and from the shortcut menu, select <b>Display</b> &gt; <b>Display Related Elements</b>.</li> 
   <li>In the open dialog, specify the required options and click <b>OK</b>.</li> 
  </ol>
