  <h2><font face="Arial" color="#5A6D94">Change numbering of messages in Communication diagram </font></h2> 
  <ol> 
   <li>Right-click the empty area on the Communication diagram.</li> 
   <li>On the shortcut menu, point to <b>Numbering</b> and then click <b>Change Numbering.</b></li> 
   <li>In the <b>Change Communication Numbering</b> dialog, edit the numbering.</li> 
   <li>Click <b>OK</b> when you are done.</li> 
  </ol>  
 </body>
