  <h2><font face="Arial" color="#5A6D94">Creating new projects from templates</font></h2> 
  <ol> 
   <li>From the <b>File</b> menu, select <b>New Project</b> or press <b>Ctrl</b> + <b>Shift</b> + <b>N</b>. The <b>New Project</b> dialog appears.</li> 
   <li>Expand the <b>Other</b> group and select the <b>Project from Template</b> icon.</li> 
   <li>Choose one of the available templates.</li> 
  </ol>
