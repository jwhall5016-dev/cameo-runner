  <h2><font face="Arial" color="#5A6D94">Displaying all existing paths</font></h2> 
  <p>Do one of the following:</p> 
  <ul> 
   <li>Right-click the selected shape. From the shortcut menu, select <b>Display</b> &gt; <b>Display All Paths</b>.</li> 
   <li>On the diagram toolbar, click <img border="0" src="tip85.png"> and select <b>Display All Paths</b>.</li> 
   <li>On the main menu, click the <b>Analyze</b> &gt; <b>Display All Paths</b>.</li> 
  </ul>
